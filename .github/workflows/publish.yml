name: Publish

on:
    push:
        branches:
            - 2.x

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        if: github.actor == github.repository_owner
        steps:
            -   name: Checkout base branch
                uses: actions/checkout@v2

            -   name: Setup JDK
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Read Gradle Properties
                id: read_gradle_properties
                run: |   # read ${mod_version}-${minecraft_version} from gradle.properties
                    WHISPER_JNI_VERSION=$(sed -n 's/^[[:space:]]*whisper_jni_version[[:space:]]*=[[:space:]]*\(.*\)[[:space:]]*$/\1/p' gradle.properties)
                    MOD_VERSION=$(sed -n 's/^[[:space:]]*mod_version[[:space:]]*=[[:space:]]*\(.*\)[[:space:]]*$/\1/p' gradle.properties)
                    MINECRAFT_VERSION=$(sed -n 's/^[[:space:]]*minecraft_version[[:space:]]*=[[:space:]]*\(.*\)[[:space:]]*$/\1/p' gradle.properties)
                    TAG_NAME="v${MOD_VERSION}-${MINECRAFT_VERSION}"
                    MODRINTH_VERSION_TYPE=$(sed -n 's/^[[:space:]]*modrinth_version_type[[:space:]]*=[[:space:]]*\(.*\)[[:space:]]*$/\1/p' gradle.properties)

                    echo "Modrinth Version Type: $MODRINTH_VERSION_TYPE"
                    
                    echo "whisper_jni_version=$WHISPER_JNI_VERSION" >> $GITHUB_OUTPUT
                    if [ "$MODRINTH_VERSION_TYPE" = "release" ]; then
                      echo "gh_is_prerelease=false" >> $GITHUB_OUTPUT
                    else
                      echo "gh_is_prerelease=true" >> $GITHUB_OUTPUT
                    fi
                    echo gh_is_prerelease=$MODRINTH_VERSION_TYPE
                    echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

            -   name: Modrinth Publish
                env:
                    MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
                run: |
                    ./gradlew :fabric:modrinth
                    ./gradlew :neoforge:modrinth

            -   name: Read Changelog
                id: read_changelog
                run: |
                    if [ -f "Changelog.md" ]; then
                      FIRST_LINE=$(head -n 1 Changelog.md)
                      RELEASE_TITLE=$(echo "$FIRST_LINE" | awk -F '[()]' '{print $2}')
                      echo "release_title=$RELEASE_TITLE"
                      echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
                    else
                      echo "Changelog.md not found. Using default values."
                      echo "release_title=Release ${{ steps.read_gradle_properties.outputs.tag_name }}" >> $GITHUB_OUTPUT
                    fi

            -   name: Create Release
                id: create_release
                uses: actions/create-release@v1
                env:
                    GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
                with:
                    tag_name: ${{ steps.read_gradle_properties.outputs.tag_name }}
                    release_name: ${{ steps.read_changelog.outputs.release_title }}
                    body_path: Changelog.md
                    draft: false
                    prerelease: ${{ steps.read_gradle_properties.outputs.gh_is_prerelease }}

            -   name: Install GitHub CLI
                run: |
                    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
                    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
                    sudo apt update
                    sudo apt install gh -y
                env:
                    GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}

            -   name: Upload Release Assets
                env:
                    GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
                run: |
                    for jar_file in fabric/build/libs/*.jar; do
                      if [ -f "$jar_file" ]; then
                        asset_name=$(basename "$jar_file")
                        echo "Uploading $jar_file as $asset_name"
                        gh release upload ${{ steps.read_gradle_properties.outputs.tag_name }} "$jar_file" --clobber
                      fi
                    done
                    for jar_file in neoforge/build/libs/*.jar; do
                      if [ -f "$jar_file" ]; then
                        asset_name=$(basename "$jar_file")
                        echo "Uploading $jar_file as $asset_name"
                        gh release upload ${{ steps.read_gradle_properties.outputs.tag_name }} "$jar_file" --clobber
                      fi
                    done