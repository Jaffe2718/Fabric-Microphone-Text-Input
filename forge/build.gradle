plugins {
    id 'com.modrinth.minotaur'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    include forgeDependencies("io.github.jaffe2718:whisper-jni:$rootProject.whisper_jni_version")

    forge "net.minecraftforge:forge:$rootProject.forge_version"
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation "maven.modrinth:midnightlib:${rootProject.midnightlib_version}-forge"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand "version": project.version,
               "forge_versionRange": project.forge_versionRange,
               "architectury_versionRange": project.architectury_versionRange,
               "mc_versionRange": project.mc_versionRange
    }
}

tasks.named('runClient') {
    jvmArgs '-Djava.awt.headless=false'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    from(rootDir.toPath().toString() + "/LICENSE") {
        rename { "${it}_${rootProject.archives_name}"}
    }
    archiveFileName = "${rootProject.archives_name}-${rootProject.version}+${project.minecraft_version}-${project.name}.jar"
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = 'ynA13Vjn'
    versionNumber = rootProject.mod_version + "-forge"
    versionType = rootProject.getPublishVersionType()
    uploadFile = remapJar
    loaders = ["forge"]
    dependencies {
        required.project 'architectury-api'
        required.project 'midnightlib'
    }
    changelog = rootProject.ext.publish_changelog
}