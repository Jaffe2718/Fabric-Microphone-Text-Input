plugins {
    id 'com.modrinth.minotaur'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

sourceSets {
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    runs {
        testClient {
            client()
            configName = "Test Minecraft Client"
            source sourceSets.test
        }
    }
    runs.removeIf {
        it.name == "server"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    testCompileClasspath.extendsFrom common
    testRuntimeClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    include "io.github.jaffe2718:whisper-jni:$rootProject.whisper_jni_version"
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"
//    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation "maven.modrinth:midnightlib:${rootProject.midnightlib_version}-fabric"
    modRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    testImplementation "io.github.jaffe2718:qwen3asr4j:${project.qwen3asr4j_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

}

processResources {
    inputs.property 'version', project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "compatibility_fabricloader_versions": project.compatibility_fabricloader_versions,
                "compatibility_minecraft_versions": project.compatibility_minecraft_versions,
                "compatibility_midnightlib_versions": project.compatibility_midnightlib_versions
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    from(rootDir.toPath().toString() + "/LICENSE") {
        rename { "${it}_${rootProject.archives_name}"}
    }
    archiveFileName = "${rootProject.archives_name}-${rootProject.version}+${project.minecraft_version}-${project.name}.jar"
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = 'ynA13Vjn'
    versionNumber = rootProject.mod_version + "-fabric"
    versionType = rootProject.getPublishVersionType()
    uploadFile = remapJar
    loaders = ["fabric", "quilt"]
    dependencies {
        required.project 'fabric-api'
        required.project 'midnightlib'
        optional.project 'modmenu'
    }
    changelog = rootProject.ext.publish_changelog
}
