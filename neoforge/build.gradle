plugins {
    id "com.modrinth.minotaur" version "2.+"
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    include forgeDependencies("io.github.freshsupasulley:whisper-jni:$rootProject.whisper_jni_version")

    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "maven.modrinth:midnightlib:${rootProject.midnightlib_version}-neoforge"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand "version": project.version,
               "neoforge_versionRange": project.neoforge_versionRange,
               "architectury_versionRange": project.architectury_versionRange,
               "mc_versionRange": project.mc_versionRange
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

def publish_changelog = {
    if (rootProject.file('Changelog.md').exists()) {
        println('Found Changelog.md')
        def changelog = ''
        rootProject.file('Changelog.md').readLines().each { line ->
            if (!line.startsWith('# ')) {
                changelog += line + '\n'
            }
        }
        return changelog
    } else {
        println('Changelog.md not found, skipping changelog upload')
        return ''
    }
}()

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = 'ynA13Vjn'
    versionType = rootProject.modrinth_version_type
    uploadFile = remapJar
    loaders = ["neoforge"]
    dependencies {
        required.project 'architectury-api'
        required.project 'midnightlib'
        optional.project 'modmenu'
    }
    changelog = publish_changelog
}